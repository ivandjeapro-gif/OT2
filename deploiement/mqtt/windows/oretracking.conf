# =====================================================================
# Broker MQTT OreTracking — version Windows (PC de la passerelle)
# Mosquitto 2.1, charge via include_dir depuis
# C:\Program Files\mosquitto\mosquitto.conf
#
# Exposition : Tailscale Funnel termine le TLS sur
#   oretracking.<tailnet>.ts.net:443  ->  127.0.0.1:1883
# Rien n'ecoute sur le reseau : le seul port est lie a 127.0.0.1.
#
# Comptes et droits : module « Dynamic Security » (19/11). Les comptes des
# DT sont crees, desactives et supprimes A CHAUD par la passerelle, d'apres
# la flotte du SaaS : jamais de redemarrage, aucune autre tablette coupee.
# Contrat des sujets : ELEMENTS CONJOINTS/19 Novembre/CDC_AGENT_DT_ALIGNEMENT_MQTT_2026-11-19.md
# =====================================================================

per_listener_settings false
allow_anonymous false

plugin C:/Program Files/mosquitto/mosquitto_dynamic_security.dll
plugin_opt_config_file C:/ProgramData/OreTracking/mosquitto/dynamic-security.json

persistence true
persistence_location C:/ProgramData/OreTracking/mosquitto/data/
autosave_interval 60

log_dest file C:/ProgramData/OreTracking/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

max_packet_size 16384
max_queued_messages 500
max_keepalive 120

# Tablettes (par le tunnel), passerelle et administration : compte obligatoire
listener 1883 127.0.0.1
