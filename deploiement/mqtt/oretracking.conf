# =====================================================================
# Broker MQTT OreTracking (Mosquitto 2.x) — suivi temps reel des DT
# Installe par installer_broker.sh dans /etc/mosquitto/conf.d/
# Contrat des sujets : ELEMENTS CONJOINTS/19 Novembre/CDC_MQTT_APP_DT_2026-11-19.md
# =====================================================================

per_listener_settings false

# Personne n'entre sans compte ; chaque compte n'a que ses sujets (acl).
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Session persistante des tablettes (evenements QoS 1 gardes hors reseau)
# et derniere position (retain) conservees au redemarrage du broker.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60

# Messages courts (une position < 350 octets) : on refuse le reste.
max_packet_size 16384
max_queued_messages 500
max_keepalive 120

log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages true

# --- MQTT chiffre (tablettes, passerelle) ---
listener 8883
protocol mqtt
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2

# --- Repli : MQTT sur WebSocket chiffre, port 443 ---
# (si un operateur 4G bloque le port 8883)
listener 443
protocol websockets
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2
